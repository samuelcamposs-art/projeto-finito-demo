<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: entrar</title>
  <style>
    :root {
      --verde: #6EA67F;
      --roxo: #9484B3;
      --azul-claro: #BEDBE9;
      --cinza-claro: #EAE6E3;
      --texto: #3B3A40;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--cinza-claro); color: var(--texto);
    }
    .banner {
      background: var(--roxo); color: #fff; text-align: center;
      padding: 10px; font-weight: 700; letter-spacing: .04em; font-size: .9rem;
    }
    header { text-align: center; padding: 28px 16px 8px; }
    header img { width: 220px; max-width: 70%; height: auto; }
    main { max-width: 380px; margin: 8px auto 48px; padding: 0 20px; }
    form, .info {
      background: #fff; padding: 24px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(59,58,64,.08); border-top: 4px solid var(--azul-claro);
    }
    label { display: block; font-size: .9rem; margin-bottom: 14px; color: var(--texto); }
    input {
      display: block; width: 100%; margin-top: 6px; padding: 10px;
      border: 1px solid #cfc9c5; border-radius: 6px; font-size: 1rem; background: #fff;
    }
    input:focus { outline: 2px solid var(--verde); border-color: var(--verde); }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 6px;
      background: var(--verde); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    button:hover { filter: brightness(.95); }
    button.secundario {
      background: transparent; color: var(--roxo); font-weight: 500;
      text-decoration: underline; margin-top: 12px;
    }
    .msg { min-height: 1.2em; font-size: .9rem; margin-top: 14px; color: var(--texto); text-align: center; }
    .info p { margin: 8px 0; }
    .perfil { color: var(--roxo); font-weight: 600; }
  </style>
</head>
<body>
  <div class="banner">Cuidado Paliativo Multiprofissional</div>

  <header>
    <img src="logo.png" alt="Projeto Finito">
  </header>

  <main>
    <!-- Entrar -->
    <form id="form-login" hidden>
      <label>E-mail
        <input type="email" id="email" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" id="senha" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar</button>
      <button type="button" class="secundario" id="esqueci">Esqueci minha senha</button>
    </form>

    <!-- Definir nova senha (vem do link recebido por e-mail) -->
    <form id="form-nova-senha" hidden>
      <p>Defina sua senha de acesso.</p>
      <label>Nova senha (mínimo 8 caracteres)
        <input type="password" id="nova-senha" required minlength="8" autocomplete="new-password">
      </label>
      <button type="submit">Salvar senha</button>
    </form>

    <!-- Sessão ativa -->
    <section id="sessao" class="info" hidden>
      <p>Olá, <strong id="nome"></strong></p>
      <p>Perfil: <span class="perfil" id="papel"></span></p>
      <p>Painel em construção.</p>
      <button type="button" class="secundario" id="sair">Sair</button>
    </section>

    <p class="msg" id="msg" role="alert"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable): feita para uso no navegador. Não usar chave secreta aqui.
    const SUPABASE_URL = 'https://lkfmaienspuiufqhmmag.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    const PAPEIS = { master: 'Master', prestador: 'Profissional', esf: 'ESF' };

    function mostrar(tela) {
      ['form-login', 'form-nova-senha', 'sessao'].forEach((id) => { $(id).hidden = id !== tela; });
    }

    async function mostrarSessao() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { mostrar('form-login'); return; }
      const { data, error } = await sb.from('usuarios')
        .select('nome, papel')
        .eq('auth_uid', session.user.id)
        .maybeSingle();
      if (error || !data) {
        await sb.auth.signOut();
        mostrar('form-login');
        $('msg').textContent = 'Conta sem perfil ativo. Fale com a coordenação.';
        return;
      }
      window.location.href = 'dashboard.html';
    }

    // Link de recuperação: o Supabase abre a página já autenticada em modo de recuperação
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') { mostrar('form-nova-senha'); }
    });

    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('msg').textContent = 'Entrando...';
      const { error } = await sb.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('senha').value,
      });
      $('senha').value = '';
      if (error) { $('msg').textContent = 'E-mail ou senha inválidos.'; return; }
      $('msg').textContent = '';
      await mostrarSessao();
    });

    $('esqueci').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { $('msg').textContent = 'Informe seu e-mail para receber o link.'; return; }
      await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/' });
      $('msg').textContent = 'Se o e-mail estiver cadastrado, você receberá um link para definir a senha.';
    });

    $('form-nova-senha').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.updateUser({ password: $('nova-senha').value });
      if (error) { $('msg').textContent = 'Não foi possível salvar a senha. Solicite um novo link.'; return; }
      $('nova-senha').value = '';
      $('msg').textContent = 'Senha definida com sucesso.';
      window.history.replaceState({}, '', '/');
      await mostrarSessao();
    });

    $('sair').addEventListener('click', async () => {
      await sb.auth.signOut();
      $('msg').textContent = '';
      mostrar('form-login');
    });

    mostrarSessao();
  </script>
</body>
</html>
