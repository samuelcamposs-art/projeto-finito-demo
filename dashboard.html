<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: painel</title>
  <style>
    [hidden] { display:none !important; }
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.95rem; font-weight:600; color:var(--roxo); }
    .btn { display:inline-block; padding:9px 16px; border:0; border-radius:6px; background:var(--verde); color:#fff; font-weight:600; cursor:pointer; text-decoration:none; font-size:.95rem; }
    .linkbtn { background:transparent; color:var(--roxo); text-decoration:underline; font-weight:500; padding:0; border:0; cursor:pointer; font-size:.9rem; }
    main { max-width:1100px; margin:20px auto; padding:0 16px 40px; }
    .filtros { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; background:#fff; padding:14px; border-radius:12px; margin-bottom:16px; border-top:4px solid var(--azul); }
    .filtros label { font-size:.85rem; display:flex; flex-direction:column; gap:4px; }
    select, input { padding:7px; border:1px solid #cfc9c5; border-radius:6px; font-size:.9rem; background:#fff; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .kpi { background:#fff; padding:14px; border-radius:12px; border-left:5px solid var(--verde); }
    .kpi b { display:block; font-size:1.5rem; color:var(--roxo); }
    .kpi span { font-size:.8rem; }
    .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    .card { background:#fff; padding:16px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.06); }
    .clicavel { cursor:pointer; transition:box-shadow .15s; }
    .clicavel:hover { box-shadow:0 4px 14px rgba(148,132,179,.35); }
    .card h2 { font-size:1rem; margin:0 0 10px; color:var(--roxo); }
    .rodape { font-size:.8rem; color:#7b7880; margin:8px 0 0; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    td, th { padding:6px; border-bottom:1px solid #eee; text-align:left; }
    th { color:var(--verde); }
    .pac-link { color:var(--roxo); font-weight:600; text-decoration:underline; }
    .vazio { color:#888; font-size:.85rem; }
    .acoes { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px; font-size:.9rem; }
    dialog { border:0; border-radius:12px; padding:20px; width:min(900px,94vw); max-height:86vh; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(59,58,64,.5); }
    dialog h2 { color:var(--roxo); margin-top:0; }
    #impressao, #cabecalho-impressao { display:none; }
    @media print {
      body { background:#fff; }
      .banner, header.topo, .nao-imprimir, .grade, .cards, dialog { display:none !important; }
      #impressao { display:block; }
      #cabecalho-impressao { display:block; margin-bottom:12px; font-size:12px; }
      #impressao > div { break-inside:avoid; margin-bottom:14px; }
      #impressao h3 { color:#000; font-size:14px; margin:6px 0; }
      .oculto-impressao { display:none !important; }
    }
  </style>
</head>
<body>
  <div class="banner">DEMONSTRAÇÃO: dados fictícios</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="btn" id="btn-acao" href="#" hidden></a>
      <a class="btn" id="btn-prof" href="cadastrar-profissional.html" hidden>Cadastrar profissional</a>
      <div class="usuario" id="nome"></div>
      <button class="linkbtn" id="sair">Sair</button>
    </div>
  </header>

  <main>
    <div id="cabecalho-impressao"></div>

    <form class="filtros nao-imprimir" onsubmit="return false">
      <label>De <input type="date" id="f-de"></label>
      <label>Até <input type="date" id="f-ate"></label>
      <label id="lbl-prest" hidden>Prestador <select id="f-prest"></select></label>
      <label>Situação do paciente <select id="f-sit"></select></label>
      <button type="button" class="btn" id="aplicar">Aplicar</button>
    </form>

    <div class="acoes nao-imprimir">
      <span>Incluir no PDF:</span>
      <div id="checks"></div>
      <button type="button" class="btn" id="pdf">Exportar PDF</button>
    </div>

    <p id="erro" style="color:#7a2030"></p>
    <div id="kpis"></div>
    <div class="grade" id="grade"></div>
    <p class="rodape nao-imprimir">Clique em um relatório para ver os dados completos. Clique no nome de um paciente para abrir o perfil.</p>
    <div id="impressao"></div>
  </main>

  <dialog id="detalhe">
    <div id="detalhe-corpo"></div>
    <p style="text-align:right"><button class="btn" id="fechar">Fechar</button></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). O acesso aos dados é controlado pelo RLS do banco.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const HOJE = new Date().toISOString().slice(0, 10);
    const PAPEL = { master: 'Master', prestador: 'Profissional' };
    const STATUS = { em_espera: 'Em espera', ativo: 'Ativo', interrompido: 'Interrompido', falecido: 'Falecido' };
    const SEXO = { feminino: 'Feminino', masculino: 'Masculino', nao_informado: 'Não informado' };

    let eu = null, cidade = null, SECOES = [];
    let usuarios = new Map(), pacientes = [], sens = new Map(), com = [], visitas = [], designacoes = [], agenda = [];

    const dias = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
    const anos = (nasc) => Math.floor(dias(nasc, HOJE) / 365.25);
    const fmt = (iso) => (iso ? iso.split('-').reverse().join('/') : '—');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kpi = (v, r) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(r)}</span></div>`;
    const perfilHref = (id) => `perfil-paciente.html?id=${id}`;
    const linkPac = (id, nome) => ({ t: nome || '—', href: perfilHref(id) });

    // Célula pode ser texto ou {t, href}: o segundo gera link (ex.: nome do paciente)
    const cel = (c) => (c && typeof c === 'object')
      ? `<a class="pac-link" href="${esc(c.href)}">${esc(c.t)}</a>`
      : esc(c);

    function tabela(cab, linhas) {
      if (!linhas.length) return '<p class="vazio">Sem dados no filtro atual.</p>';
      return `<table><tr>${cab.map((h) => `<th>${esc(h)}</th>`).join('')}</tr>` +
        linhas.map((r) => `<tr>${r.map((c) => `<td>${cel(c)}</td>`).join('')}</tr>`).join('') + '</table>';
    }

    function contar(lista, fn) {
      const m = new Map();
      for (const x of lista) { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); }
      return [...m.entries()].sort((a, b) => b[1] - a[1]);
    }

    function faixasDe(idades) {
      if (!idades.length) return [];
      const s = [...idades].sort((a, b) => a - b);
      const k = Math.min(5, new Set(s).size);
      const tam = Math.ceil(s.length / k);
      const out = [];
      for (let i = 0; i < s.length; i += tam) {
        const g = s.slice(i, i + tam);
        const a = g[0], b = g[g.length - 1];
        out.push([a === b ? `${a} anos` : `${a} a ${b} anos`, g.length]);
      }
      return out;
    }

    function ultimoPorPaciente(lista) {
      const m = new Map();
      for (const v of lista) if (v.situacao === 'concluida') { const a = m.get(v.paciente_id); if (!a || v.data_visita > a) m.set(v.paciente_id, v.data_visita); }
      return m;
    }

    async function carregar() {
      const [p, s, c, v, d, us, ag, ci] = await Promise.all([
        sb.from('pacientes').select('id,numero,nome,sexo,bairro,esf,status,data_inicio,data_interrupcao,data_obito,excluido_em'),
        sb.from('pacientes_sensiveis').select('paciente_id,data_nascimento'),
        sb.from('paciente_comorbidades').select('paciente_id,comorbidades(nome)'),
        sb.from('visitas').select('id,paciente_id,prestador_id,data_visita,situacao,excluido_em'),
        sb.from('designacoes').select('paciente_id,usuario_id,ativa'),
        sb.from('usuarios').select('id,nome,papel,area,ativo'),
        sb.from('agenda_designada').select('id,paciente_id,data_visita,situacao,prestador_id'),
        sb.from('cidades').select('nome,dias_sem_visita_alerta').maybeSingle(),
      ]);
      if ([p, s, c, v, d, us, ag, ci].some((r) => r.error)) $('erro').textContent = 'Não foi possível carregar alguns dados. Atualize a página.';
      pacientes = (p.data || []).filter((x) => !x.excluido_em);
      sens = new Map((s.data || []).map((x) => [x.paciente_id, x]));
      com = c.data || [];
      visitas = (v.data || []).filter((x) => !x.excluido_em);
      designacoes = (d.data || []).filter((x) => x.ativa);
      usuarios = new Map((us.data || []).map((x) => [x.id, x]));
      agenda = ag.data || [];
      cidade = ci.data || null;
    }

    // ---------- relatórios do master ----------
    function relMaster(pac, vis) {
      const ids = new Set(pac.map((p) => p.id));
      const conc = vis.filter((v) => v.situacao === 'concluida');
      const agd = vis.filter((v) => v.situacao === 'agendada');
      const atend = new Set(conc.map((v) => v.paciente_id)).size;
      const cont = (s) => pac.filter((p) => p.status === s).length;
      const tempos = pac.filter((p) => p.data_inicio).map((p) => dias(p.data_inicio, p.data_obito || p.data_interrupcao || HOJE) / 30.44);
      const tmed = tempos.length ? (tempos.reduce((a, b) => a + b, 0) / tempos.length).toFixed(1) : '0';
      const media = atend ? (conc.length / atend).toFixed(1) : '0';
      const N = cidade?.dias_sem_visita_alerta ?? 60;
      const ultimo = ultimoPorPaciente(visitas);
      const nomeP = new Map(pacientes.map((p) => [p.id, p.nome]));

      const porP = new Map();
      for (const v of vis) {
        const u = usuarios.get(v.prestador_id);
        const n = u ? u.nome : 'Desconhecido';
        const r = porP.get(n) || { area: u?.area || '—', c: 0, g: 0 };
        if (v.situacao === 'concluida') r.c++; else if (v.situacao === 'agendada') r.g++;
        porP.set(n, r);
      }

      const idades = []; let semD = 0;
      for (const p of pac) { const s = sens.get(p.id); if (s?.data_nascimento) idades.push(anos(s.data_nascimento)); else semD++; }
      const faixas = faixasDe(idades); if (semD) faixas.push(['Não informado', semD]);

      const comF = com.filter((c) => ids.has(c.paciente_id));
      const semV = pac.filter((p) => p.status === 'ativo' && (!ultimo.get(p.id) || dias(ultimo.get(p.id), HOJE) >= N));
      const prox = visitas.filter((v) => v.situacao === 'agendada' && v.data_visita >= HOJE && ids.has(v.paciente_id))
        .sort((a, b) => a.data_visita.localeCompare(b.data_visita));

      const kpis = kpi(pac.length, 'Pacientes') + kpi(cont('ativo'), 'Ativos') + kpi(cont('em_espera'), 'Em espera') +
        kpi(cont('interrompido'), 'Interrompidos') + kpi(cont('falecido'), 'Falecidos') + kpi(conc.length, 'Visitas concluídas') +
        kpi(agd.length, 'Visitas agendadas') + kpi(media, 'Visitas por paciente atendido') + kpi(tmed, 'Tempo médio (meses)');

      const secoes = [
        { id: 'sexo', titulo: 'Pacientes por sexo', cab: ['Sexo', 'Total'], linhas: contar(pac, (p) => (p.sexo ? SEXO[p.sexo] : 'Não informado')) },
        { id: 'faixa', titulo: 'Faixa etária', cab: ['Faixa', 'Pacientes'], linhas: faixas },
        { id: 'situacao', titulo: 'Pacientes por situação', cab: ['Situação', 'Total'], linhas: Object.entries(STATUS).map(([k, v]) => [v, cont(k)]) },
        { id: 'bairro', titulo: 'Pacientes por bairro', cab: ['Bairro', 'Total'], linhas: contar(pac, (p) => p.bairro || 'Não informado') },
        { id: 'esf', titulo: 'Pacientes por ESF', cab: ['ESF', 'Total'], linhas: contar(pac, (p) => p.esf || 'Não informado') },
        { id: 'comorb', titulo: 'Pacientes por comorbidade', cab: ['Comorbidade', 'Total'], linhas: contar(comF, (c) => c.comorbidades?.nome || 'Não informado') },
        { id: 'prest', titulo: 'Visitas por prestador (período)', cab: ['Prestador', 'Área', 'Concluídas', 'Agendadas'], linhas: [...porP.entries()].map(([n, r]) => [n, r.area, r.c, r.g]) },
        { id: 'semvisita', titulo: `Ativos sem visita há ${N} dias ou mais`, cab: ['Paciente', 'Último atendimento'],
          linhas: semV.map((p) => [linkPac(p.id, p.nome), ultimo.get(p.id) ? fmt(ultimo.get(p.id)) : 'Nunca']) },
        { id: 'agenda', titulo: 'Próximas visitas agendadas', cab: ['Data', 'Paciente', 'Prestador'],
          linhas: prox.map((v) => [fmt(v.data_visita), linkPac(v.paciente_id, nomeP.get(v.paciente_id)), usuarios.get(v.prestador_id)?.nome || '—']) },
      ];
      return { kpis, secoes };
    }

    // ---------- relatórios do profissional (só pacientes designados e as próprias visitas) ----------
    function relProf(pac, vis) {
      const ids = new Set(pac.map((p) => p.id));
      const conc = vis.filter((v) => v.situacao === 'concluida');
      const agd = vis.filter((v) => v.situacao === 'agendada');
      const ultimo = ultimoPorPaciente(visitas.filter((v) => v.prestador_id === eu.id));
      const N = cidade?.dias_sem_visita_alerta ?? 60;
      const prox = (pid) => agenda.filter((a) => a.paciente_id === pid && a.situacao === 'agendada' && a.data_visita >= HOJE)
        .map((a) => a.data_visita).sort()[0];
      const nomeP = new Map(pac.map((p) => [p.id, p.nome]));
      const agF = agenda.filter((a) => a.data_visita >= HOJE && ids.has(a.paciente_id))
        .sort((a, b) => a.data_visita.localeCompare(b.data_visita));

      const kpis = kpi(pac.length, 'Pacientes designados') + kpi(pac.filter((p) => p.status === 'ativo').length, 'Ativos') +
        kpi(conc.length, 'Minhas visitas concluídas (período)') + kpi(agd.length, 'Minhas visitas agendadas (período)');

      const idades = []; let semD = 0;
      for (const p of pac) { const s = sens.get(p.id); if (s?.data_nascimento) idades.push(anos(s.data_nascimento)); else semD++; }
      const faixas = faixasDe(idades); if (semD) faixas.push(['Não informado', semD]);

      const semV = pac.filter((p) => p.status === 'ativo' && (!ultimo.get(p.id) || dias(ultimo.get(p.id), HOJE) >= N));

      const secoes = [
        { id: 'meus', titulo: 'Meus pacientes designados', cab: ['Paciente', 'Situação', 'Início', 'Minha última visita', 'Próxima visita'],
          linhas: pac.map((p) => [linkPac(p.id, p.nome), STATUS[p.status] || p.status, fmt(p.data_inicio), ultimo.get(p.id) ? fmt(ultimo.get(p.id)) : '—', prox(p.id) ? fmt(prox(p.id)) : '—']) },
        { id: 'faixa', titulo: 'Faixa etária dos meus pacientes', cab: ['Faixa', 'Pacientes'], linhas: faixas },
        { id: 'comorb', titulo: 'Comorbidades dos meus pacientes', cab: ['Comorbidade', 'Total'], linhas: contar(com.filter((c) => ids.has(c.paciente_id)), (c) => c.comorbidades?.nome || 'Não informado') },
        { id: 'agenda', titulo: 'Agenda futura dos meus pacientes', cab: ['Data', 'Paciente', 'Quem atende', 'Situação'],
          linhas: agF.map((a) => [fmt(a.data_visita), linkPac(a.paciente_id, nomeP.get(a.paciente_id)), a.prestador_id === eu.id ? 'Você' : 'Outro profissional', a.situacao]) },
        { id: 'semvisita', titulo: `Meus ativos sem visita há ${N} dias ou mais`, cab: ['Paciente', 'Minha última visita'],
          linhas: semV.map((p) => [linkPac(p.id, p.nome), ultimo.get(p.id) ? fmt(ultimo.get(p.id)) : 'Nunca']) },
      ];
      return { kpis, secoes };
    }

    // ---------- render ----------
    function render() {
      const f = {
        de: $('f-de').value, ate: $('f-ate').value, sit: $('f-sit').value,
        prest: eu.papel === 'master' ? ($('f-prest').value || null) : eu.id,
      };
      const base = eu.papel === 'master'
        ? new Set(pacientes.map((p) => p.id))
        : new Set(designacoes.filter((d) => d.usuario_id === eu.id).map((d) => d.paciente_id));
      const pac = pacientes.filter((p) => base.has(p.id) &&
        (f.sit === 'todas' || p.status === f.sit) &&
        (eu.papel !== 'master' || !f.prest || designacoes.some((d) => d.usuario_id === f.prest && d.paciente_id === p.id)));
      const idsPac = new Set(pac.map((p) => p.id));
      const vis = visitas.filter((v) => v.data_visita >= f.de && v.data_visita <= f.ate &&
        (eu.papel === 'master'
          ? idsPac.has(v.paciente_id) && (!f.prest || v.prestador_id === f.prest)
          : v.prestador_id === eu.id));

      const r = eu.papel === 'master' ? relMaster(pac, vis) : relProf(pac, vis);
      SECOES = r.secoes;
      $('kpis').innerHTML = `<div class="cards">${r.kpis}</div>`;
      $('grade').innerHTML = SECOES.map((s, i) =>
        `<section class="card clicavel" data-i="${i}"><h2>${esc(s.titulo)}</h2>${tabela(s.cab, s.linhas.slice(0, 5))}` +
        `<p class="rodape">${s.linhas.length > 5 ? `Mostrando 5 de ${s.linhas.length}. Clique para ver todos.` : 'Clique para ver detalhes.'}</p></section>`).join('');
      $('impressao').innerHTML = SECOES.map((s) =>
        `<div data-secao="${s.id}" data-titulo="${esc(s.titulo)}"><h3>${esc(s.titulo)}</h3>${tabela(s.cab, s.linhas)}</div>`).join('');
      $('checks').innerHTML = SECOES.map((s) =>
        `<label style="display:inline-flex;gap:4px;margin-right:10px"><input type="checkbox" checked data-alvo="${s.id}"> ${esc(s.titulo)}</label>`).join('');
      cabecalho(f);
    }

    function cabecalho(f) {
      const sit = f.sit === 'todas' ? 'Todas' : STATUS[f.sit];
      const pr = f.prest ? (usuarios.get(f.prest)?.nome || '—') : 'Todos';
      $('cabecalho-impressao').innerHTML =
        `<strong>Projeto Finito: relatório${cidade ? ' · ' + esc(cidade.nome) : ''}</strong><br>` +
        `Período: ${fmt(f.de)} a ${fmt(f.ate)} · Situação: ${esc(sit)} · Prestador: ${esc(pr)}<br>` +
        `Gerado em ${new Date().toLocaleString('pt-BR')} por ${esc(eu.nome)} (${PAPEL[eu.papel]})`;
    }

    function exportar() {
      document.querySelectorAll('#checks input').forEach((c) => {
        const el = document.querySelector(`#impressao [data-secao="${c.dataset.alvo}"]`);
        if (el) el.classList.toggle('oculto-impressao', !c.checked);
      });
      window.print();
    }

    // ---------- inicialização ----------
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel,area,cidade_id').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      eu = u;
      $('nome').textContent = eu.nome;

      const btn = $('btn-acao');
      if (eu.papel === 'master') {
        btn.textContent = 'Cadastrar paciente'; btn.href = 'cadastrar-paciente.html';
        $('btn-prof').hidden = false;
      } else {
        btn.textContent = 'Agendar visita'; btn.href = 'agendar-visita.html';
      }
      btn.hidden = false;

      const ini = new Date(); ini.setDate(ini.getDate() - 365);
      $('f-de').value = ini.toISOString().slice(0, 10);
      $('f-ate').value = HOJE;
      $('f-sit').innerHTML = '<option value="todas">Todas</option>' +
        Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

      await carregar();

      if (eu.papel === 'master') {
        $('lbl-prest').hidden = false;
        $('f-prest').innerHTML = '<option value="">Todos</option>' +
          [...usuarios.values()].filter((x) => x.papel === 'prestador')
            .map((x) => `<option value="${x.id}">${esc(x.nome)}</option>`).join('');
      }

      $('aplicar').onclick = render;
      $('pdf').onclick = exportar;
      $('sair').onclick = async () => { await sb.auth.signOut(); location.href = 'index.html'; };
      $('fechar').onclick = () => $('detalhe').close();
      $('grade').addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        const c = e.target.closest('.clicavel');
        if (!c) return;
        const s = SECOES[Number(c.dataset.i)];
        $('detalhe-corpo').innerHTML = `<h2>${esc(s.titulo)}</h2>${tabela(s.cab, s.linhas)}`;
        $('detalhe').showModal();
      });
      render();
    })();
  </script>
</body>
</html>
