<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: painel</title>
  <style>
    [hidden] { display:none !important; }
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.95rem; font-weight:600; color:var(--roxo); }
    .btn { display:inline-block; padding:9px 16px; border:0; border-radius:6px; background:var(--verde); color:#fff; font-weight:600; cursor:pointer; text-decoration:none; font-size:.95rem; }
    .linkbtn { background:transparent; color:var(--roxo); text-decoration:underline; font-weight:500; padding:0; border:0; cursor:pointer; font-size:.9rem; }
    main { max-width:1100px; margin:20px auto; padding:0 16px 40px; }
    .filtros { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; background:#fff; padding:14px; border-radius:12px; margin-bottom:16px; border-top:4px solid var(--azul); }
    .filtros label { font-size:.85rem; display:flex; flex-direction:column; gap:4px; }
    select, input { padding:7px; border:1px solid #cfc9c5; border-radius:6px; font-size:.9rem; background:#fff; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
    .kpi { background:#fff; padding:14px; border-radius:12px; border-left:5px solid var(--verde); }
    .kpi b { display:block; font-size:1.5rem; color:var(--roxo); }
    .kpi span { font-size:.8rem; }
    .grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
    .card { background:#fff; padding:16px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.06); }
    .clicavel { cursor:pointer; transition:box-shadow .15s; }
    .clicavel:hover { box-shadow:0 4px 14px rgba(148,132,179,.35); }
    .card h2 { font-size:1rem; margin:0 0 10px; color:var(--roxo); }
    .rodape { font-size:.8rem; color:#7b7880; margin:8px 0 0; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    td, th { padding:6px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
    th { color:var(--verde); }
    .pac-link { color:var(--roxo); font-weight:600; text-decoration:underline; }
    .vazio { color:#888; font-size:.85rem; }
    .impr { display:none; }
    .painel-impr { background:#fff; padding:14px; border-radius:12px; margin-top:20px; }
    .painel-impr h2 { font-size:1rem; color:var(--roxo); margin:0 0 10px; }
    .chks { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:6px 14px; font-size:.9rem; }
    .chks label { display:flex; gap:6px; align-items:center; }
    .acoes { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    .erro { color:#7a2030; font-size:.9rem; }
    dialog { border:0; border-radius:12px; padding:20px; width:min(900px,94vw); max-height:86vh; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(59,58,64,.5); }
    dialog h2 { color:var(--roxo); margin-top:0; }
    #impressao { display:none; }
    @media print {
      body { background:#fff; }
      body * { visibility:hidden; }
      #impressao, #impressao * { visibility:visible; }
      #impressao { display:block; position:absolute; left:0; top:0; width:100%; font-size:12px; }
      #impressao .bloco { break-inside:auto; margin-bottom:14px; }
      #impressao h3 { color:#000; font-size:14px; margin:8px 0 4px; }
      #impressao .cab { margin-bottom:12px; border-bottom:1px solid #999; padding-bottom:6px; }
      .tela { display:none; }
      .impr { display:inline; }
      .pac-link { color:#000; text-decoration:none; }
      td, th { padding:4px; }
    }
  </style>
</head>
<body>
  <div class="banner">Cuidado Paliativo Multiprofissional</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="btn" id="lk-paciente" href="cadastrar-paciente.html" hidden>Cadastrar paciente</a>
      <a class="btn" id="lk-acesso" href="cadastrar-profissional.html" hidden>Cadastrar novo acesso</a>
      <a class="btn" id="lk-ajustes" href="ajustes.html" hidden>Ajustes</a>
      <a class="btn" id="lk-agendar" href="agendar-visita.html" hidden>Agendar visita</a>
      <div class="usuario"><span id="nome"></span><div id="papel-txt" style="font-weight:400;font-size:.85rem"></div></div>
      <button class="linkbtn" id="sair">Sair</button>
    </div>
  </header>

  <main>
    <form class="filtros" onsubmit="return false">
      <label>De <input type="date" id="f-de"></label>
      <label>Até <input type="date" id="f-ate"></label>
      <label id="lbl-prest" hidden>Profissional <select id="f-prest"></select></label>
      <label id="lbl-area" hidden>Área <select id="f-area"></select></label>
      <label>Situação do paciente <select id="f-sit"></select></label>
      <button type="button" class="btn" id="aplicar">Aplicar período</button>
    </form>
    <p class="erro" id="erro"></p>

    <div class="cards" id="kpis"></div>
    <div class="grade" id="grade"></div>
    <p class="rodape">Clique em um relatório para ver a lista completa. Nos cartões, aparece só o primeiro nome do paciente; na impressão, o nome completo.</p>

    <section class="painel-impr">
      <h2>Imprimir ou salvar em PDF</h2>
      <div class="chks" id="checks"></div>
      <div class="acoes">
        <button type="button" class="linkbtn" id="marcar">Marcar todas</button>
        <button type="button" class="linkbtn" id="desmarcar">Desmarcar todas</button>
        <button type="button" class="btn" id="imprimir">Imprimir selecionadas</button>
      </div>
    </section>

    <div id="impressao"></div>
  </main>

  <dialog id="detalhe">
    <div id="detalhe-corpo"></div>
    <p style="text-align:right"><button class="btn" id="fechar">Fechar</button></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). O acesso aos dados é controlado pelo RLS do banco e pelas funções do painel.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hojeLocal = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
    const HOJE = hojeLocal();
    const ROTULO = { ativo: 'Ativo', em_espera: 'Em espera', interrompido: 'Interrompido', falecido: 'Falecido' };
    const SEXO = { feminino: 'Feminino', masculino: 'Masculino', nao_informado: 'Não informado' };
    const PAPEL = { master: 'Master', esf: 'ESF', prestador: 'Profissional' };

    // Datas AAAA-MM-DD, sem fuso
    const ts = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    const diasEntre = (a, b) => Math.round((ts(b) - ts(a)) / 86400000);
    const idadeEm = (nasc, ref) => {
      const [y, m, d] = nasc.split('-').map(Number); const [Y, M, D] = ref.split('-').map(Number);
      let a = Y - y; if (M < m || (M === m && D < d)) a--; return a;
    };
    const fmt = (iso) => (iso ? iso.split('-').reverse().join('/') : '—');
    const primeiroNome = (n) => (n || '').trim().split(/\s+/)[0] || '';
    const pt1 = (x) => x.toFixed(1).replace('.', ',');
    const nomeLink = (id, nome) => `<a class="pac-link" href="perfil-paciente.html?id=${id}"><span class="tela">${esc(primeiroNome(nome))}</span><span class="impr">${esc(nome)}</span></a>`;
    const kpi = (v, r) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(r)}</span></div>`;
    // Células já vêm em HTML (use esc() em textos)
    const tabela = (cab, linhas, limite) => {
      if (!linhas.length) return '<p class="vazio">Sem dados no filtro atual.</p>';
      const l = limite ? linhas.slice(0, limite) : linhas;
      return `<table><tr>${cab.map((h) => `<th>${esc(h)}</th>`).join('')}</tr>` +
        l.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('') + '</table>';
    };
    const contar = (lista, fn) => {
      const m = new Map();
      for (const x of lista) { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); }
      return [...m.entries()].sort((a, b) => b[1] - a[1]);
    };
    // Faixas adaptativas: divide as idades em até 5 grupos, sem faixas vazias
    const faixasDe = (idades) => {
      if (!idades.length) return [];
      const s = [...idades].sort((a, b) => a - b);
      const k = Math.min(5, new Set(s).size);
      const tam = Math.ceil(s.length / k);
      const out = [];
      for (let i = 0; i < s.length; i += tam) {
        const g = s.slice(i, i + tam); const a = g[0], b = g[g.length - 1];
        out.push([a === b ? `${a} anos` : `${a} a ${b} anos`, g.length]);
      }
      return out;
    };
    // Situação do paciente na data final do período
    const situacaoEm = (p, fim) => {
      if (p.cadastro > fim) return null;
      if (p.data_obito && p.data_obito <= fim) return 'falecido';
      if (p.data_interrupcao && p.data_interrupcao <= fim) return 'interrompido';
      if ((p.datas_atendimento || []).some((d) => d <= fim)) return 'ativo';
      return 'em_espera';
    };
    const tempoDias = (p, fim) => {
      const inicio = p.data_inicio || (p.datas_atendimento || [])[0] || p.cadastro;
      let t = fim;
      if (p.st === 'falecido') t = p.data_obito; else if (p.st === 'interrompido') t = p.data_interrupcao;
      return Math.max(0, diasEntre(inicio, t));
    };

    let eu = null, cidade = null, usuarios = new Map(), pacientes = [], visitas = [], agendaP = [];
    let ini = '', fim = '', S = [], C = {};

    const filtros = () => ({ prest: $('f-prest').value, area: $('f-area').value, sit: $('f-sit').value });
    const ok = (uid) => {
      const f = filtros(); const u = usuarios.get(uid);
      return (!f.prest || uid === f.prest) && (!f.area || (u && u.area === f.area));
    };

    function calcular() {
      const f = filtros();
      const N = cidade?.dias_sem_visita_alerta ?? 60;
      const eqp = !!(f.prest || f.area);
      const todos = pacientes.map((p) => ({ ...p, st: situacaoEm(p, fim) })).filter((p) => p.st);
      const pacs = todos.filter((p) => (!f.sit || p.st === f.sit) &&
        (!eqp || p.prestadores.some(ok) || visitas.some((v) => v.paciente_id === p.id && ok(v.prestador_id))));
      const ids = new Set(pacs.map((p) => p.id));
      const vis = visitas.filter((v) => ids.has(v.paciente_id) && (!eqp || ok(v.prestador_id)));
      const concl = vis.filter((v) => v.situacao === 'concluida');
      const agend = vis.filter((v) => v.situacao === 'agendada');
      const ativos = pacs.filter((p) => p.st === 'ativo');
      const ultimoDe = (p) => { const d = (p.datas_atendimento || []).filter((x) => x <= fim); return d.length ? d[d.length - 1] : null; };
      const comIdade = ativos.filter((p) => p.data_nascimento)
        .map((p) => ({ p, idade: idadeEm(p.data_nascimento, fim) })).sort((a, b) => b.idade - a.idade);
      const tempo = pacs.filter((p) => p.st !== 'em_espera')
        .map((p) => ({ p, dias: tempoDias(p, fim) })).sort((a, b) => b.dias - a.dias);
      C = {
        N, pacs, vis, concl, agend, ativos, ultimoDe, comIdade, tempo,
        espera: agend.filter((v) => v.data_visita > HOJE).sort((a, b) => a.data_visita.localeCompare(b.data_visita)),
        semConc: agend.filter((v) => v.data_visita <= HOJE).sort((a, b) => a.data_visita.localeCompare(b.data_visita)),
        semVisita: ativos.filter((p) => { const u = ultimoDe(p); return !u || diasEntre(u, fim) >= N; }),
        idadeMedia: comIdade.length ? comIdade.reduce((s, x) => s + x.idade, 0) / comIdade.length : null,
        tempoMedio: tempo.length ? tempo.reduce((s, x) => s + x.dias, 0) / tempo.length / 30.44 : null,
        mediaVisitas: pacs.length ? concl.length / pacs.length : null,
      };
    }

    const nomeProf = (id) => usuarios.get(id)?.nome || '—';
    const areaProf = (id) => usuarios.get(id)?.area || '—';
    const comorbidadesDe = (lista) => { const r = []; lista.forEach((p) => (p.comorbidades || []).forEach((n) => r.push(n))); return r; };

    function montarMaster() {
      const c = C;
      const cont = (st) => c.pacs.filter((p) => p.st === st).length;
      const kpis = [
        [c.pacs.length, 'Pacientes'], [cont('ativo'), 'Ativos'], [cont('em_espera'), 'Em espera'],
        [cont('interrompido'), 'Interrompidos'], [cont('falecido'), 'Falecidos'],
        [c.idadeMedia == null ? '—' : pt1(c.idadeMedia), 'Idade média (ativos)'],
        [c.concl.length, 'Visitas concluídas'], [c.espera.length, 'Visitas em espera'],
        [c.semConc.length, 'Agendamentos sem conclusão'],
        [c.mediaVisitas == null ? '—' : pt1(c.mediaVisitas), 'Visitas por paciente (média)'],
        [c.tempoMedio == null ? '—' : pt1(c.tempoMedio), 'Tempo médio (meses)'],
      ];
      const idades = []; let semD = 0;
      for (const p of c.pacs) { if (p.data_nascimento) idades.push(idadeEm(p.data_nascimento, fim)); else semD++; }
      const faixas = faixasDe(idades); if (semD) faixas.push(['Não informado', semD]);

      const porProf = new Map();
      for (const v of c.vis) {
        const r = porProf.get(v.prestador_id) || { n: nomeProf(v.prestador_id), a: areaProf(v.prestador_id), c: 0, g: 0 };
        if (v.situacao === 'concluida') r.c++; else if (v.situacao === 'agendada') r.g++;
        porProf.set(v.prestador_id, r);
      }

      const secoes = [
        { titulo: 'Pacientes por sexo', cab: ['Sexo', 'Total'], linhas: contar(c.pacs, (p) => SEXO[p.sexo] || 'Não informado').map(([k, n]) => [esc(k), n]) },
        { titulo: 'Faixa etária', cab: ['Faixa', 'Pacientes'], linhas: faixas.map(([k, n]) => [esc(k), n]) },
        { titulo: 'Pacientes por situação', cab: ['Situação', 'Total'], linhas: Object.entries(ROTULO).map(([k, v]) => [esc(v), c.pacs.filter((p) => p.st === k).length]) },
        { titulo: 'Pacientes por bairro', cab: ['Bairro', 'Total'], linhas: contar(c.pacs, (p) => p.bairro || 'Não informado').map(([k, n]) => [esc(k), n]) },
        { titulo: 'Pacientes por ESF', cab: ['ESF', 'Total'], linhas: contar(c.pacs, (p) => p.esf || 'Não informado').map(([k, n]) => [esc(k), n]) },
        { titulo: 'Pacientes por comorbidade', cab: ['Comorbidade', 'Total'], linhas: contar(comorbidadesDe(c.pacs), (x) => x).map(([k, n]) => [esc(k), n]) },
        { titulo: 'Visitas por profissional (período)', cab: ['Profissional', 'Área', 'Concluídas', 'Agendadas'], linhas: [...porProf.values()].map((r) => [esc(r.n), esc(r.a), r.c, r.g]) },
        { titulo: 'Visitas realizadas (período)', cab: ['Data', 'Paciente', 'Profissional'], linhas: c.concl.map((v) => [fmt(v.data_visita), nomeLink(v.paciente_id, v.paciente_nome), esc(nomeProf(v.prestador_id))]) },
        { titulo: 'Próximas visitas agendadas', cab: ['Data', 'Paciente', 'Profissional'], linhas: c.espera.map((v) => [fmt(v.data_visita), nomeLink(v.paciente_id, v.paciente_nome), esc(nomeProf(v.prestador_id))]) },
        { titulo: 'Agendamentos sem conclusão', cab: ['Data', 'Paciente', 'Profissional'], linhas: c.semConc.map((v) => [fmt(v.data_visita), nomeLink(v.paciente_id, v.paciente_nome), esc(nomeProf(v.prestador_id))]) },
        { titulo: `Ativos sem visita há ${c.N} dias ou mais`, cab: ['Paciente', 'Último atendimento'], linhas: c.semVisita.map((p) => { const u = c.ultimoDe(p); return [nomeLink(p.id, p.nome), u ? fmt(u) : 'Nunca']; }) },
        { titulo: 'Cadastros incompletos', cab: ['Paciente', 'Bairro', 'ESF'], linhas: c.pacs.filter((p) => p.dados_incompletos).map((p) => [nomeLink(p.id, p.nome), esc(p.bairro || '—'), esc(p.esf || '—')]) },
        { titulo: 'Ranking de idade (ativos)', cab: ['Posição', 'Paciente', 'Idade'], linhas: c.comIdade.map((x, i) => [i + 1, nomeLink(x.p.id, x.p.nome), x.idade]) },
        { titulo: 'Ranking de tempo de acompanhamento', cab: ['Posição', 'Paciente', 'Situação', 'Meses'], linhas: c.tempo.map((x, i) => [i + 1, nomeLink(x.p.id, x.p.nome), esc(ROTULO[x.p.st]), pt1(x.dias / 30.44)]) },
      ];
      return { kpis, secoes };
    }

    function montarProfissional() {
      const c = C;
      const kpis = [
        [c.pacs.length, 'Pacientes designados'], [c.ativos.length, 'Ativos'],
        [c.concl.length, 'Minhas visitas concluídas (período)'], [c.agend.length, 'Minhas visitas agendadas (período)'],
      ];
      const nomes = new Map(c.pacs.map((p) => [p.id, p.nome]));
      const proxima = (pid) => agendaP.filter((a) => a.paciente_id === pid && a.situacao === 'agendada' && a.data_visita >= HOJE)
        .map((a) => a.data_visita).sort()[0];
      const ultimoMeu = (pid) => c.concl.filter((v) => v.paciente_id === pid).map((v) => v.data_visita).sort().pop();
      const idades = []; let semD = 0;
      for (const p of c.pacs) { if (p.data_nascimento) idades.push(idadeEm(p.data_nascimento, fim)); else semD++; }
      const faixas = faixasDe(idades); if (semD) faixas.push(['Não informado', semD]);
      const agF = agendaP.filter((a) => a.data_visita >= HOJE && nomes.has(a.paciente_id))
        .sort((a, b) => a.data_visita.localeCompare(b.data_visita));

      const secoes = [
        { titulo: 'Meus pacientes designados', cab: ['Paciente', 'Situação', 'Início', 'Minha última visita', 'Próxima visita'],
          linhas: c.pacs.map((p) => [nomeLink(p.id, p.nome), esc(ROTULO[p.st]), fmt(p.data_inicio), fmt(ultimoMeu(p.id)), fmt(proxima(p.id))]) },
        { titulo: 'Faixa etária dos meus pacientes', cab: ['Faixa', 'Pacientes'], linhas: faixas.map(([k, n]) => [esc(k), n]) },
        { titulo: 'Comorbidades dos meus pacientes', cab: ['Comorbidade', 'Total'], linhas: contar(comorbidadesDe(c.pacs), (x) => x).map(([k, n]) => [esc(k), n]) },
        { titulo: 'Agenda futura dos meus pacientes', cab: ['Data', 'Paciente', 'Quem atende', 'Situação'],
          linhas: agF.map((a) => [fmt(a.data_visita), nomeLink(a.paciente_id, nomes.get(a.paciente_id)), a.prestador_id === eu.id ? 'Você' : 'Outro profissional', esc(a.situacao)]) },
        { titulo: 'Agendamentos sem conclusão (meus)', cab: ['Data', 'Paciente'],
          linhas: c.semConc.map((v) => [fmt(v.data_visita), nomeLink(v.paciente_id, v.paciente_nome)]) },
        { titulo: 'Minhas visitas realizadas (período)', cab: ['Data', 'Paciente', 'Área'],
          linhas: c.concl.map((v) => [fmt(v.data_visita), nomeLink(v.paciente_id, v.paciente_nome), esc(eu.area || '—')]) },
        { titulo: `Ativos sem visita há ${c.N} dias ou mais`, cab: ['Paciente', 'Último atendimento'],
          linhas: c.semVisita.map((p) => { const u = c.ultimoDe(p); return [nomeLink(p.id, p.nome), u ? fmt(u) : 'Nunca']; }) },
        { titulo: 'Ranking de idade (ativos)', cab: ['Posição', 'Paciente', 'Idade'], linhas: c.comIdade.map((x, i) => [i + 1, nomeLink(x.p.id, x.p.nome), x.idade]) },
        { titulo: 'Ranking de tempo de acompanhamento', cab: ['Posição', 'Paciente', 'Situação', 'Meses'], linhas: c.tempo.map((x, i) => [i + 1, nomeLink(x.p.id, x.p.nome), esc(ROTULO[x.p.st]), pt1(x.dias / 30.44)]) },
      ];
      return { kpis, secoes };
    }

    function cabecalhoHtml() {
      const f = filtros();
      const sit = f.sit ? ROTULO[f.sit] : 'Todas';
      const pr = f.prest ? nomeProf(f.prest) : 'Todos';
      const ar = f.area || 'Todas';
      return `<div class="cab"><strong>Projeto Finito: relatório${cidade ? ' · ' + esc(cidade.nome) : ''}</strong><br>` +
        `Período: ${fmt(ini)} a ${fmt(fim)} · Situação: ${esc(sit)} · Profissional: ${esc(pr)} · Área: ${esc(ar)}<br>` +
        `Gerado em ${new Date().toLocaleString('pt-BR')} por ${esc(eu.nome)} (${esc(PAPEL[eu.papel])})</div>`;
    }

    function render() {
      calcular();
      const r = eu.papel === 'prestador' ? montarProfissional() : montarMaster();
      // Seções em ordem alfabética
      S = r.secoes.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
      $('kpis').innerHTML = r.kpis.map(([v, t]) => kpi(v, t)).join('');
      $('grade').innerHTML = S.map((s, i) =>
        `<section class="card clicavel" data-i="${i}"><h2>${esc(s.titulo)}</h2>${tabela(s.cab, s.linhas, 5)}` +
        `<p class="rodape">${s.linhas.length > 5 ? `Mostrando 5 de ${s.linhas.length}. Clique para ver todos.` : 'Clique para ver detalhes.'}</p></section>`).join('');
      const marcados = new Set([...document.querySelectorAll('#checks input:checked')].map((c) => c.value));
      $('checks').innerHTML = S.map((s, i) =>
        `<label><input type="checkbox" value="${i}" ${marcados.size === 0 || marcados.has(String(i)) ? 'checked' : ''}> ${esc(s.titulo)}</label>`).join('');
    }

    async function carregar() {
      ini = $('f-de').value; fim = $('f-ate').value;
      if (!ini || !fim || ini > fim) { $('erro').textContent = 'Confira o período: a data inicial deve ser anterior à final.'; return; }
      $('erro').textContent = 'Carregando...';
      const [p, v, ag] = await Promise.all([
        sb.rpc('painel_pacientes', { p_fim: fim }),
        sb.rpc('painel_visitas', { p_ini: ini, p_fim: fim }),
        sb.from('agenda_designada').select('id,paciente_id,data_visita,situacao,prestador_id'),
      ]);
      if (p.error || v.error) { $('erro').textContent = 'Não foi possível carregar: ' + (p.error || v.error).message; return; }
      pacientes = p.data || []; visitas = v.data || []; agendaP = ag.data || [];
      $('erro').textContent = '';
      render();
    }

    // Cartões: lista completa em modal
    $('grade').addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const c = e.target.closest('.clicavel');
      if (!c) return;
      const s = S[Number(c.dataset.i)];
      $('detalhe-corpo').innerHTML = `<h2>${esc(s.titulo)}</h2>${tabela(s.cab, s.linhas)}`;
      $('detalhe').showModal();
    });
    $('fechar').addEventListener('click', () => $('detalhe').close());

    // Impressão: só as listas marcadas, com nome completo
    $('marcar').addEventListener('click', () => document.querySelectorAll('#checks input').forEach((c) => (c.checked = true)));
    $('desmarcar').addEventListener('click', () => document.querySelectorAll('#checks input').forEach((c) => (c.checked = false)));
    $('imprimir').addEventListener('click', () => {
      const idx = [...document.querySelectorAll('#checks input:checked')].map((c) => Number(c.value));
      if (!idx.length) { alert('Marque pelo menos uma lista.'); return; }
      $('impressao').innerHTML = cabecalhoHtml() + idx.sort((a, b) => a - b).map((i) =>
        `<div class="bloco"><h3>${esc(S[i].titulo)}</h3>${tabela(S[i].cab, S[i].linhas)}</div>`).join('');
      window.print();
    });

    ['f-prest', 'f-area', 'f-sit'].forEach((id) => $(id).addEventListener('change', () => { if (pacientes.length || visitas.length) render(); }));
    $('aplicar').addEventListener('click', carregar);
    $('sair').addEventListener('click', async () => { await sb.auth.signOut(); location.href = 'index.html'; });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel,area,cidade_id').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      eu = u;
      $('nome').textContent = u.nome;
      $('papel-txt').textContent = PAPEL[u.papel] || '';
      const gestor = u.papel === 'master' || u.papel === 'esf';
      $('lk-paciente').hidden = u.papel !== 'master';
      $('lk-acesso').hidden = u.papel !== 'master';
      $('lk-ajustes').hidden = u.papel !== 'master';
      $('lk-agendar').hidden = u.papel !== 'prestador';

      const { data: us } = await sb.from('usuarios').select('id,nome,papel,area,sede_esf').order('nome');
      usuarios = new Map((us || []).map((x) => [x.id, x]));
      const profs = (us || []).filter((x) => x.papel === 'prestador');
      $('lbl-prest').hidden = !gestor;
      $('lbl-area').hidden = !gestor;
      $('f-prest').innerHTML = '<option value="">Todos</option>' + profs.map((x) => `<option value="${x.id}">${esc(x.nome)}</option>`).join('');
      const areas = [...new Set(profs.map((x) => x.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      $('f-area').innerHTML = '<option value="">Todas</option>' + areas.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
      $('f-sit').innerHTML = '<option value="">Todas</option>' + Object.entries(ROTULO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

      const { data: cd } = await sb.from('cidades').select('nome,dias_sem_visita_alerta').maybeSingle();
      cidade = cd || null;

      const d = new Date(); d.setDate(d.getDate() - 365);
      $('f-de').value = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      $('f-ate').value = HOJE;
      await carregar();
    })();
  </script>
</body>
</html>
