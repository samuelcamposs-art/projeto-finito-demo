<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: cadastrar paciente</title>
  <style>
    [hidden] { display:none !important; }
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.95rem; font-weight:600; color:var(--roxo); }
    .linkbtn { color:var(--roxo); text-decoration:underline; font-weight:500; font-size:.9rem; }
    main { max-width:640px; margin:24px auto; padding:0 16px 40px; }
    h1 { font-size:1.4rem; color:var(--roxo); }
    form { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.08); border-top:4px solid var(--azul); }
    fieldset { border:1px solid #e3ddd9; border-radius:8px; padding:14px; margin:0 0 18px; }
    legend { color:var(--roxo); font-weight:600; padding:0 6px; }
    label.campo { display:block; font-size:.9rem; margin-bottom:12px; }
    input, select, textarea { display:block; width:100%; margin-top:5px; padding:9px; border:1px solid #cfc9c5; border-radius:6px; font-size:.95rem; background:#fff; font-family:inherit; }
    .duplo { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .linha { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .linha select { flex:1; min-width:180px; margin-top:0; }
    .linha input { flex:1; min-width:180px; margin-top:0; }
    .contato { border:1px dashed #cfc9c5; border-radius:8px; padding:10px; margin-bottom:10px; }
    .contato .campos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .contato .campos input, .contato .campos select { margin-top:4px; }
    .contato .campos label { font-size:.85rem; }
    .contato .campos .c-nome-box, .contato .campos .c-par-box { grid-column:1 / -1; }
    .btn-mais { background:transparent; border:1px solid var(--verde); color:var(--verde); border-radius:6px; padding:6px 12px; cursor:pointer; font-weight:600; }
    .btn-rem { background:transparent; border:0; color:#9a3a4a; cursor:pointer; font-size:.85rem; text-decoration:underline; }
    .presta { display:block; font-weight:normal; margin:6px 0; font-size:.95rem; }
    button.btn { width:100%; padding:11px; border:0; border-radius:6px; background:var(--verde); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    .msg { min-height:1.2em; font-size:.9rem; margin-top:12px; text-align:center; }
  </style>
</head>
<body>
  <div class="banner">Cuidado Paliativo Multiprofissional</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="linkbtn" href="dashboard.html">Voltar ao painel</a>
      <div class="usuario" id="nome"></div>
    </div>
  </header>

  <main>
    <h1>Cadastrar paciente</h1>

    <form id="form">
      <fieldset>
        <legend>Identificação</legend>
        <div class="duplo">
          <label class="campo">Nome *
            <input id="nome-pac" required>
          </label>
          <label class="campo">Sobrenome *
            <input id="sobrenome" required>
          </label>
        </div>
        <label class="campo">Sexo *
          <select id="sexo" required>
            <option value="">Selecione</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="nao_informado">Não informado</option>
          </select>
        </label>
        <label class="campo">Data de nascimento *
          <input type="date" id="nasc" required>
        </label>
        <label class="campo">Bairro *
          <input id="bairro" required>
        </label>
        <label class="campo">Endereço
          <input id="endereco">
        </label>
        <label class="campo">ESF (número da sede) *
          <input type="number" id="sede" min="1" step="1" required>
        </label>
        <label class="campo">Data do cadastro *
          <input type="date" id="dcad" required>
        </label>
        <script>
          (() => { const d = new Date(); document.getElementById('dcad').value = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); })();
        </script>
      </fieldset>

      <fieldset>
        <legend>Clínico</legend>
        <div id="comorbidades"></div>
        <button type="button" class="btn-mais" id="add-com">+ Adicionar comorbidade</button>
      </fieldset>

      <fieldset>
        <legend>Contatos</legend>
        <div id="contatos"></div>
        <button type="button" class="btn-mais" id="add-contato">+ Adicionar contato</button>
      </fieldset>

      <fieldset>
        <legend>Acompanhamento</legend>
        <label class="campo">Observação
          <textarea id="obs" rows="2"></textarea>
        </label>
        <p style="font-size:.9rem;margin:0 0 4px"><strong>Prestadores designados *</strong></p>
        <div id="prestadores"></div>
      </fieldset>

      <button class="btn" type="submit">Salvar paciente</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). O RLS do banco permite cadastro apenas ao master da cidade.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const OUTRA = '__outra__';
    let eu = null, COMS = [];

    function opcoesComorbidade() {
      return '<option value="">Selecione</option>' +
        COMS.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('') +
        `<option value="${OUTRA}">Outra (escrever nova)</option>`;
    }

    function novaLinhaComorbidade() {
      const div = document.createElement('div');
      div.className = 'linha';
      div.innerHTML = `<select class="com-sel">${opcoesComorbidade()}</select>
        <input class="com-outra" placeholder="Nome da nova comorbidade" hidden>
        <button type="button" class="btn-rem">Remover</button>`;
      const sel = div.querySelector('.com-sel');
      const txt = div.querySelector('.com-outra');
      sel.addEventListener('change', () => { txt.hidden = sel.value !== OUTRA; });
      div.querySelector('.btn-rem').addEventListener('click', () => {
        if (document.querySelectorAll('.com-sel').length > 1) div.remove();
        else sel.value = '';
      });
      $('comorbidades').appendChild(div);
    }

    const TIPO_TXT = { proprio: 'Próprio', familiar: 'Familiar', cuidador: 'Cuidador' };

    function novoContato() {
      const div = document.createElement('div');
      div.className = 'contato';
      div.innerHTML = `<div class="campos">
          <label>Número (celular com DDD) *
            <input class="c-tel" inputmode="numeric" placeholder="37999999999" required>
          </label>
          <label>Selecionar *
            <select class="c-tipo" required>
              <option value="">Selecione</option>
              <option value="proprio">Próprio</option>
              <option value="familiar">Familiar</option>
              <option value="cuidador">Cuidador (ILPI, amigos e cuidadores)</option>
            </select>
          </label>
          <label class="c-nome-box" hidden>Nome *
            <input class="c-nome" placeholder="Nome do contato">
          </label>
          <label class="c-par-box" hidden>Parentesco *
            <input class="c-par" placeholder="Ex.: filha, nora">
          </label>
        </div>
        <button type="button" class="btn-rem" style="margin-top:6px">Remover contato</button>`;
      const tipo = div.querySelector('.c-tipo');
      const box = div.querySelector('.c-nome-box');
      const nome = div.querySelector('.c-nome');
      const parBox = div.querySelector('.c-par-box');
      const par = div.querySelector('.c-par');
      tipo.addEventListener('change', () => {
        const mostra = tipo.value === 'familiar' || tipo.value === 'cuidador';
        const familiar = tipo.value === 'familiar';
        box.hidden = !mostra;
        nome.required = mostra;
        parBox.hidden = !familiar;
        par.required = familiar;
      });
      div.querySelector('.btn-rem').addEventListener('click', () => div.remove());
      $('contatos').appendChild(div);
    }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel,cidade_id').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      if (u.papel !== 'master') { location.href = 'dashboard.html'; return; }
      eu = u;
      $('nome').textContent = eu.nome;

      const [com, pres] = await Promise.all([
        sb.from('comorbidades').select('id,nome').order('nome'),
        sb.from('usuarios').select('id,nome,area').eq('papel', 'prestador').eq('ativo', true).order('nome'),
      ]);
      COMS = com.data || [];
      novaLinhaComorbidade();
      novoContato();
      $('prestadores').innerHTML = (pres.data || []).map((p) =>
        `<label class="presta"><input type="checkbox" class="presta-chk" value="${p.id}" style="display:inline;width:auto;margin-right:6px"> ${esc(p.nome)} (${esc(p.area)})</label>`).join('');
    })();

    $('add-com').addEventListener('click', novaLinhaComorbidade);
    $('add-contato').addEventListener('click', novoContato);

    async function resolverComorbidade(sel, txt) {
      if (sel.value !== OUTRA) return sel.value;
      const nome = txt.value.trim();
      if (!nome) throw new Error('Escreva o nome da comorbidade nova.');
      const existente = COMS.find((c) => c.nome.toLowerCase() === nome.toLowerCase());
      if (existente) return existente.id;
      const { data, error } = await sb.from('comorbidades')
        .insert({ cidade_id: eu.cidade_id, nome }).select('id,nome').single();
      if (error) throw new Error('Não foi possível criar a comorbidade: ' + error.message);
      COMS.push(data);
      return data.id;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = $('msg');
      const prest = [...document.querySelectorAll('.presta-chk:checked')].map((c) => c.value);
      if (!prest.length) { m.textContent = 'Designe pelo menos um prestador.'; return; }

      const contatos = [...document.querySelectorAll('.contato')].map((c) => {
        const tipo = c.querySelector('.c-tipo').value;
        const nome = c.querySelector('.c-nome').value.trim();
        const par = c.querySelector('.c-par').value.trim();
        return {
          tipo,
          nome: tipo === 'proprio' ? null : (nome || null),
          parentesco: tipo === 'familiar' ? (par || null) : null,
          telefone: c.querySelector('.c-tel').value.replace(/\D/g, ''),
        };
      });
      if (!contatos.length) { m.textContent = 'Cadastre pelo menos um contato.'; return; }
      const invalido = contatos.find((c) => !c.tipo || ![10, 11].includes(c.telefone.length) || (c.tipo !== 'proprio' && !c.nome) || (c.tipo === 'familiar' && !c.parentesco));
      if (invalido) { m.textContent = 'Confira os contatos: selecione o tipo, informe o nome (quando não for Próprio), o parentesco (quando for Familiar) e o celular com DDD (10 ou 11 dígitos).'; return; }

      m.textContent = 'Salvando...';
      try {
        const ids = [];
        for (const linha of document.querySelectorAll('#comorbidades .linha')) {
          const sel = linha.querySelector('.com-sel');
          if (!sel.value) continue;
          const id = await resolverComorbidade(sel, linha.querySelector('.com-outra'));
          if (!ids.includes(id)) ids.push(id);
        }
        if (!ids.length) { m.textContent = 'Informe pelo menos uma comorbidade.'; return; }

        const nomeCompleto = `${$('nome-pac').value.trim()} ${$('sobrenome').value.trim()}`;

        const { data: ult } = await sb.from('pacientes').select('numero').order('numero', { ascending: false }).limit(1);
        const numero = (ult && ult[0] ? ult[0].numero : 0) + 1;

        const { data: pac, error: e1 } = await sb.from('pacientes').insert({
          cidade_id: eu.cidade_id, numero, nome: nomeCompleto,
          sexo: $('sexo').value, bairro: $('bairro').value.trim(), esf: String(Number($('sede').value) || ''),
          sede_esf: Number($('sede').value) || null, data_cadastro: $('dcad').value,
        }).select('id').single();
        if (e1) throw new Error('Erro ao salvar paciente: ' + e1.message);

        const { error: e2 } = await sb.from('pacientes_sensiveis').insert({
          paciente_id: pac.id, cidade_id: eu.cidade_id,
          data_nascimento: $('nasc').value,
          endereco: $('endereco').value.trim() || null,
          contato_principal_nome: contatos[0].nome || nomeCompleto,
          contato_principal_parentesco: contatos[0].parentesco,
          contato_principal_telefone: contatos[0].telefone,
          contatos_adicionais: contatos,
          observacao: $('obs').value.trim() || null,
        });
        if (e2) throw new Error('Paciente criado, mas os dados pessoais falharam: ' + e2.message);

        const { error: e3 } = await sb.from('paciente_comorbidades').insert(
          ids.map((id, i) => ({ cidade_id: eu.cidade_id, paciente_id: pac.id, comorbidade_id: id, principal: i === 0 })));
        if (e3) throw new Error('Paciente criado, mas as comorbidades falharam: ' + e3.message);

        const { error: e4 } = await sb.from('designacoes').insert(
          prest.map((uid) => ({ cidade_id: eu.cidade_id, paciente_id: pac.id, usuario_id: uid })));
        if (e4) throw new Error('Paciente criado, mas a designação falhou: ' + e4.message);

        m.textContent = `Paciente cadastrado (nº ${numero}).`;
        e.target.reset();
        $('comorbidades').innerHTML = '';
        $('contatos').innerHTML = '';
        novoContato();
        novaLinhaComorbidade();
      } catch (err) {
        m.textContent = err.message;
      }
    });
  </script>
</body>
</html>
