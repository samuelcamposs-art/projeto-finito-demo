<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: agendar visita</title>
  <style>
    [hidden] { display:none !important; }
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.95rem; font-weight:600; color:var(--roxo); }
    .linkbtn { color:var(--roxo); text-decoration:underline; font-weight:500; font-size:.9rem; }
    main { max-width:640px; margin:24px auto; padding:0 16px 40px; }
    h1 { font-size:1.4rem; color:var(--roxo); }
    .painel { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.08); border-top:4px solid var(--azul); }
    label.campo { display:block; font-size:.9rem; margin-bottom:14px; }
    select, input, textarea { display:block; width:100%; margin-top:6px; padding:9px; border:1px solid #cfc9c5; border-radius:6px; font-size:1rem; background:#fff; font-family:inherit; }
    .acoes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
    .btn { width:100%; padding:11px; border:0; border-radius:6px; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    .btn-confirma { background:var(--verde); }
    .btn-finaliza { background:var(--roxo); }
    .btn-pequeno { width:auto; padding:6px 12px; font-size:.85rem; border-radius:6px; border:0; color:#fff; cursor:pointer; font-weight:600; }
    .b-concluir { background:var(--verde); text-decoration:none; display:inline-block; }
    .b-cancelar { background:#9a3a4a; }
    .b-doc { background:#e6e2ef; color:#9a9aa6; cursor:not-allowed; }
    .msg { min-height:1.2em; font-size:.9rem; margin-top:12px; text-align:center; }
    .topo-lista { display:flex; justify-content:space-between; align-items:center; margin-top:32px; }
    h2 { font-size:1.05rem; color:var(--roxo); margin:0; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; background:#fff; border-radius:8px; overflow:hidden; }
    td, th { padding:8px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle; }
    th { color:var(--verde); }
    .pac-link { color:var(--roxo); font-weight:600; text-decoration:underline; }
    .vazio { color:#888; font-size:.9rem; }
    .linkbtn-btn { background:transparent; border:0; color:var(--roxo); text-decoration:underline; font-weight:500; cursor:pointer; font-size:.9rem; }
    dialog { border:0; border-radius:12px; padding:20px; width:min(760px,94vw); max-height:86vh; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(59,58,64,.5); }
    .dialog-acoes { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  </style>
</head>
<body>
  <div class="banner">Cuidado Paliativo Multiprofissional</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="linkbtn" href="dashboard.html">Voltar ao painel</a>
      <div class="usuario" id="nome"></div>
    </div>
  </header>

  <main>
    <h1>Agendar visita</h1>

    <div class="painel">
      <form id="form">
        <label class="campo">Paciente *
          <select id="paciente" required></select>
        </label>
        <label class="campo">Data *
          <input type="date" id="data" required>
        </label>
        <label class="campo">Observação
          <textarea id="obs" rows="3"></textarea>
        </label>
        <div class="acoes">
          <button class="btn btn-confirma" type="submit" id="confirmar">Confirmar agendamento</button>
          <button class="btn btn-finaliza" type="button" id="finalizar">Finalizar visita</button>
        </div>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>

    <div class="topo-lista">
      <h2>Minhas próximas visitas</h2>
      <button class="linkbtn-btn" id="ver-agenda">Ver agenda completa</button>
    </div>
    <div id="lista"></div>
  </main>

  <dialog id="agenda">
    <h2 style="color:var(--roxo);margin-top:0">Agenda completa</h2>
    <div id="agenda-corpo"></div>
    <p style="text-align:right"><button class="btn btn-confirma" style="width:auto;padding:8px 16px" id="fechar-agenda">Fechar</button></p>
  </dialog>

  <dialog id="confirma">
    <h2 style="color:var(--roxo);margin-top:0">Cancelar agendamento</h2>
    <p>Quer cancelar agendamento?</p>
    <div class="dialog-acoes">
      <button class="btn-pequeno" style="background:#9a9aa6" id="nao">Não</button>
      <button class="btn-pequeno b-cancelar" id="sim">Sim</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). O RLS do banco limita os pacientes e as visitas ao próprio profissional.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const HOJE = new Date().toISOString().slice(0, 10);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (iso) => (iso ? iso.split('-').reverse().join('/') : '—');
    let eu = null, nomes = new Map(), idCancelar = null;

    async function carregarPacientes() {
      const { data: des } = await sb.from('designacoes').select('paciente_id').eq('usuario_id', eu.id).eq('ativa', true);
      const ids = (des || []).map((d) => d.paciente_id);
      if (!ids.length) { $('paciente').innerHTML = '<option value="">Nenhum paciente designado a você</option>'; return; }
      const { data: pac } = await sb.from('pacientes').select('id,nome,excluido_em').in('id', ids).order('nome');
      const ativos = (pac || []).filter((p) => !p.excluido_em);
      ativos.forEach((p) => nomes.set(p.id, p.nome));
      $('paciente').innerHTML = '<option value="">Selecione</option>' +
        ativos.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join('');
    }

    // Próximas visitas: apenas agendadas, a partir de hoje (mesmas ações da agenda completa)
    async function carregarLista() {
      const { data } = await sb.from('visitas').select('id,paciente_id,data_visita')
        .eq('situacao', 'agendada').gte('data_visita', HOJE).order('data_visita').limit(5);
      $('lista').innerHTML = tabelaVisitas(data || [], 'Nenhuma visita agendada.');
    }

    // Tabela com Concluir e Cancelar; usada na lista e na agenda completa
    function tabelaVisitas(lista, vazio) {
      if (!lista.length) return `<p class="vazio">${vazio}</p>`;
      return `<table><tr><th>Data</th><th>Paciente</th><th></th><th></th></tr>` +
        lista.map((v) =>
          `<tr data-linha="${v.id}"><td>${fmt(v.data_visita)}</td>` +
          `<td><a class="pac-link" href="perfil-paciente.html?id=${v.paciente_id}">${esc(nomes.get(v.paciente_id) || '—')}</a></td>` +
          `<td><a class="btn-pequeno b-concluir" href="finalizar-visita.html?id=${v.id}">Concluir</a></td>` +
          `<td><button class="btn-pequeno b-cancelar" data-cancelar="${v.id}">Cancelar</button></td></tr>`).join('') +
        '</table>';
    }

    // Agenda completa: apenas visitas agendadas (não concluídas nem canceladas)
    async function renderAgenda() {
      const { data } = await sb.from('visitas').select('id,paciente_id,data_visita')
        .eq('situacao', 'agendada').order('data_visita');
      $('agenda-corpo').innerHTML = tabelaVisitas(data || [], 'Nenhuma visita na agenda.');
    }

    async function abrirAgendaCompleta() {
      await renderAgenda();
      $('agenda').showModal();
    }

    $('ver-agenda').addEventListener('click', abrirAgendaCompleta);
    $('fechar-agenda').addEventListener('click', () => $('agenda').close());

    // Cancelamento com confirmação (Sim/Não). Agendamento é descartável: a visita vira "cancelada".
    // Vale para a lista e para a agenda completa.
    function pedirCancelamento(e) {
      const b = e.target.closest('[data-cancelar]');
      if (!b) return;
      idCancelar = b.dataset.cancelar;
      $('confirma').showModal();
    }
    $('lista').addEventListener('click', pedirCancelamento);
    $('agenda-corpo').addEventListener('click', pedirCancelamento);
    $('nao').addEventListener('click', () => { idCancelar = null; $('confirma').close(); });
    $('sim').addEventListener('click', async () => {
      if (!idCancelar) return;
      const id = idCancelar;
      idCancelar = null;
      $('confirma').close();
      const { error } = await sb.from('visitas')
        .update({ situacao: 'cancelada', cancelada_motivo: 'Cancelado pelo profissional' })
        .eq('id', id);
      if (error) { $('msg').textContent = 'Não foi possível cancelar: ' + error.message; return; }
      // Remove a linha de imediato (lista e agenda), sem reabrir a agenda
      document.querySelectorAll(`tr[data-linha="${id}"]`).forEach((tr) => tr.remove());
      $('msg').textContent = 'Agendamento cancelado.';
      await carregarLista();
      if ($('agenda').open) await renderAgenda();
    });

    async function criarVisita(pid, data, obs) {
      const { data: v, error } = await sb.from('visitas')
        .insert({ cidade_id: eu.cidade_id, paciente_id: pid, prestador_id: eu.id, data_visita: data, observacao: obs })
        .select('id').single();
      if (error) throw new Error('Erro ao salvar: ' + error.message);
      return v;
    }

    function validarCampos() {
      const pid = $('paciente').value, data = $('data').value;
      if (!pid || !data) throw new Error('Preencha paciente e data.');
      return { pid, data, obs: $('obs').value.trim() || null };
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = $('msg');
      try {
        const { pid, data, obs } = validarCampos();
        if (data < HOJE) throw new Error('Para agendar, escolha uma data de hoje em diante. Para visita já feita, use "Finalizar visita".');
        m.textContent = 'Salvando...';
        await criarVisita(pid, data, obs);
        m.textContent = 'Visita agendada.';
        e.target.reset();
        await carregarLista();
      } catch (err) { m.textContent = err.message; }
    });

    $('finalizar').addEventListener('click', async () => {
      const m = $('msg');
      try {
        const { pid, data, obs } = validarCampos();
        if (data > HOJE) throw new Error('Visita finalizada não pode ter data futura.');
        m.textContent = 'Salvando...';
        const v = await criarVisita(pid, data, obs);
        location.href = `finalizar-visita.html?id=${v.id}`;
      } catch (err) { m.textContent = err.message; }
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session || !session.user.user_metadata?.senha_definida) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel,cidade_id').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      if (u.papel !== 'prestador') { location.href = 'dashboard.html'; return; }
      eu = u;
      $('nome').textContent = eu.nome;
      $('data').min = HOJE;
      await carregarPacientes();
      await carregarLista();
    })();
  </script>
</body>
</html>
