<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: agendar visita</title>
  <style>
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.9rem; }
    .usuario strong { color:var(--roxo); }
    .linkbtn { background:transparent; color:var(--roxo); text-decoration:underline; font-weight:500; padding:0; border:0; cursor:pointer; font-size:.9rem; text-decoration:none; }
    main { max-width:640px; margin:24px auto; padding:0 16px 40px; }
    h1 { font-size:1.4rem; color:var(--roxo); }
    .painel { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.08); border-top:4px solid var(--azul); }
    .modo { display:flex; gap:10px; flex-direction:column; margin-bottom:16px; }
    .modo label { display:flex; gap:8px; align-items:center; padding:10px; border:1px solid #d9d4d0; border-radius:8px; cursor:pointer; }
    label.campo { display:block; font-size:.9rem; margin-bottom:14px; }
    select, input, textarea { display:block; width:100%; margin-top:6px; padding:9px; border:1px solid #cfc9c5; border-radius:6px; font-size:1rem; background:#fff; font-family:inherit; }
    button.btn { width:100%; padding:11px; border:0; border-radius:6px; background:var(--verde); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    .msg { min-height:1.2em; font-size:.9rem; margin-top:12px; text-align:center; }
    h2 { font-size:1.05rem; color:var(--roxo); margin-top:32px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; background:#fff; border-radius:8px; overflow:hidden; }
    td, th { padding:8px; border-bottom:1px solid #eee; text-align:left; }
    th { color:var(--verde); }
    .vazio { color:#888; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="banner">DEMONSTRAÇÃO: dados fictícios</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="linkbtn" href="dashboard.html">Voltar ao painel</a>
      <div class="usuario">
        <div>Olá, <strong id="nome"></strong></div>
        <div>Profissional</div>
      </div>
    </div>
  </header>

  <main>
    <h1>Agendar visita</h1>

    <div class="painel">
      <div class="modo">
        <label><input type="radio" name="modo" value="agendar" checked> Agendar visita futura</label>
        <label><input type="radio" name="modo" value="realizada"> Registrar visita já realizada (sem agendamento)</label>
      </div>

      <form id="form">
        <label class="campo">Paciente *
          <select id="paciente" required></select>
        </label>
        <label class="campo">Data *
          <input type="date" id="data" required>
        </label>
        <label class="campo">Observação
          <textarea id="obs" rows="3"></textarea>
        </label>
        <button class="btn" type="submit">Confirmar</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>

    <h2>Minhas próximas visitas agendadas</h2>
    <div id="lista"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). O RLS do banco limita os pacientes e as visitas ao próprio profissional.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const HOJE = new Date().toISOString().slice(0, 10);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (iso) => (iso ? iso.split('-').reverse().join('/') : '—');
    let eu = null, nomes = new Map();

    function modo() { return document.querySelector('input[name="modo"]:checked').value; }

    function ajustarData() {
      const d = $('data');
      if (modo() === 'agendar') { d.min = HOJE; d.removeAttribute('max'); }
      else { d.max = HOJE; d.removeAttribute('min'); }
    }

    async function carregarPacientes() {
      const { data: des } = await sb.from('designacoes').select('paciente_id').eq('usuario_id', eu.id).eq('ativa', true);
      const ids = (des || []).map((d) => d.paciente_id);
      if (!ids.length) { $('paciente').innerHTML = '<option value="">Nenhum paciente designado a você</option>'; return; }
      const { data: pac } = await sb.from('pacientes').select('id,nome,numero,excluido_em').in('id', ids).order('nome');
      const ativos = (pac || []).filter((p) => !p.excluido_em);
      ativos.forEach((p) => nomes.set(p.id, p.nome));
      $('paciente').innerHTML = '<option value="">Selecione</option>' +
        ativos.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join('');
    }

    async function carregarLista() {
      const { data } = await sb.from('visitas').select('paciente_id,data_visita,observacao')
        .eq('situacao', 'agendada').gte('data_visita', HOJE).order('data_visita').limit(50);
      if (!data || !data.length) { $('lista').innerHTML = '<p class="vazio">Nenhuma visita agendada.</p>'; return; }
      $('lista').innerHTML = `<table><tr><th>Data</th><th>Paciente</th><th>Observação</th></tr>` +
        data.map((v) => `<tr><td>${fmt(v.data_visita)}</td><td>${esc(nomes.get(v.paciente_id) || '—')}</td><td>${esc(v.observacao || '')}</td></tr>`).join('') +
        '</table>';
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = $('msg');
      const pid = $('paciente').value, data = $('data').value, obs = $('obs').value.trim() || null;
      if (!pid || !data) { m.textContent = 'Preencha paciente e data.'; return; }
      if (modo() === 'agendar' && data < HOJE) { m.textContent = 'Data passada: use "Registrar visita já realizada".'; return; }
      if (modo() === 'realizada' && data > HOJE) { m.textContent = 'Visita realizada não pode ter data futura.'; return; }

      m.textContent = 'Salvando...';
      const { data: v, error } = await sb.from('visitas')
        .insert({ cidade_id: eu.cidade_id, paciente_id: pid, prestador_id: eu.id, data_visita: data, observacao: obs })
        .select('id').single();
      if (error) { m.textContent = 'Erro ao salvar: ' + error.message; return; }

      if (modo() === 'realizada') {
        const { error: e2 } = await sb.from('evolucoes')
          .insert({ cidade_id: eu.cidade_id, visita_id: v.id, paciente_id: pid, prestador_id: eu.id });
        m.textContent = e2 ? 'Visita criada, mas a conclusão falhou: ' + e2.message : 'Visita realizada registrada.';
      } else {
        m.textContent = 'Visita agendada.';
      }
      $('form').reset();
      ajustarData();
      carregarLista();
    });

    document.querySelectorAll('input[name="modo"]').forEach((r) => r.addEventListener('change', ajustarData));

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel,cidade_id').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      if (u.papel !== 'prestador') { location.href = 'dashboard.html'; return; }
      eu = u;
      $('nome').textContent = eu.nome;
      ajustarData();
      await carregarPacientes();
      await carregarLista();
    })();
  </script>
</body>
</html>
