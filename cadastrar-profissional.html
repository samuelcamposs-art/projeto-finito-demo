<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Finito: cadastrar novo acesso</title>
  <style>
    [hidden] { display:none !important; }
    :root { --verde:#6EA67F; --roxo:#9484B3; --azul:#BEDBE9; --cinza:#EAE6E3; --texto:#3B3A40; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--cinza); color:var(--texto); }
    .banner { background:var(--roxo); color:#fff; text-align:center; padding:8px; font-weight:700; font-size:.85rem; letter-spacing:.04em; }
    header.topo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
    header.topo img { height:56px; }
    .direita { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .usuario { text-align:right; font-size:.95rem; font-weight:600; color:var(--roxo); }
    .linkbtn { color:var(--roxo); text-decoration:underline; font-weight:500; font-size:.9rem; }
    main { max-width:640px; margin:24px auto; padding:0 16px 40px; }
    h1 { font-size:1.4rem; color:var(--roxo); }
    .painel { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(59,58,64,.08); border-top:4px solid var(--azul); }
    label { display:block; font-size:.9rem; margin-bottom:14px; }
    input, select { display:block; width:100%; margin-top:6px; padding:9px; border:1px solid #cfc9c5; border-radius:6px; font-size:1rem; background:#fff; font-family:inherit; }
    .btn { width:100%; padding:11px; border:0; border-radius:6px; background:var(--verde); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    .btn-sec { width:auto; padding:8px 14px; background:var(--roxo); color:#fff; border:0; border-radius:6px; font-weight:600; cursor:pointer; font-size:.9rem; }
    .btn-peq { width:auto; padding:6px 10px; font-size:.82rem; border:0; border-radius:6px; color:#fff; font-weight:600; cursor:pointer; }
    .msg { min-height:1.2em; font-size:.9rem; margin-top:12px; text-align:center; }
    .acima { display:flex; justify-content:space-between; align-items:center; margin-top:28px; }
    dialog { border:0; border-radius:12px; padding:20px; width:min(860px,94vw); max-height:86vh; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(59,58,64,.5); }
    h2 { font-size:1.05rem; color:var(--roxo); margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    td, th { padding:8px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle; }
    th { color:var(--verde); }
    .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.78rem; font-weight:600; }
    .tag-ok { background:#e3f1e8; color:#2f6b43; }
    .tag-pend { background:#f1ecf7; color:#5b4a80; }
    .tag-off { background:#f5e1e4; color:#7a2030; }
    .vazio { color:#888; font-size:.9rem; }
    .dialog-acoes { display:flex; justify-content:flex-end; margin-top:16px; }
    .cinza-txt { color:#6b6670; font-size:.85rem; }
    .aviso-senha { margin:12px 0 0; padding:12px; background:var(--cinza); border-radius:8px; font-size:.92rem; }
  </style>
</head>
<body>
  <div class="banner">Cuidado Paliativo Multiprofissional</div>

  <header class="topo">
    <img src="logo.png" alt="Projeto Finito">
    <div class="direita">
      <a class="linkbtn" href="dashboard.html">Voltar ao painel</a>
      <div class="usuario" id="nome"></div>
    </div>
  </header>

  <main>
    <h1>Cadastrar novo acesso</h1>

    <div class="painel">
      <form id="form">
        <label>Nome completo *
          <input id="nome-prof" required>
        </label>
        <label>E-mail *
          <input type="email" id="email" required>
        </label>
        <label>Perfil *
          <select id="tipo" required>
            <option value="prestador">Profissional</option>
            <option value="esf">ESF (sede)</option>
            <option value="master">Master (administrador)</option>
          </select>
        </label>
        <label id="lbl-area">Área de atuação *
          <select id="area"></select>
        </label>
        <label id="lbl-outra" hidden>Nova área *
          <input id="area-outra" placeholder="Digite a nova área">
        </label>
        <label id="lbl-sede" hidden>Número da sede *
          <input type="number" id="sede" min="1" step="1" placeholder="Ex.: 1">
        </label>
        <button class="btn" type="submit" id="enviar">Cadastrar acesso</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
      <p class="aviso-senha">Todo acesso novo entra com a senha inicial <strong>12345678</strong>. A pessoa pode trocá-la em "Esqueci minha senha", na tela de entrada.</p>
    </div>

    <div class="acima">
      <button class="btn-sec" type="button" id="abrir-contas">Contas de acesso já cadastradas</button>
    </div>
  </main>

  <dialog id="contas">
    <h2>Contas de acesso já cadastradas</h2>
    <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap">
      <input id="busca-conta" placeholder="Buscar por nome ou e-mail" style="flex:1;min-width:200px;margin-top:0">
      <select id="filtro-conta" style="width:auto;margin-top:0">
        <option value="">Todos os acessos</option>
        <option value="ativo">Ativos</option>
        <option value="pendente">Nunca acessaram</option>
        <option value="desativado">Desativados</option>
      </select>
    </div>
    <div id="contas-corpo"></div>
    <div class="dialog-acoes"><button class="btn-sec" type="button" id="fechar-contas">Fechar</button></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // Chave pública (publishable). A criação e a exclusão são feitas pelas funções do servidor, que validam o master.
    const sb = supabase.createClient('https://lkfmaienspuiufqhmmag.supabase.co', 'sb_publishable_oJp9-Q0gxwe7o5izcO7BGQ_1_7zmS3z');

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const OUTRA = '__outra__';
    let eu = null;

    const rotulo = (u) => u.papel === 'master' ? 'Master' : u.papel === 'esf' ? 'ESF' : 'Profissional';
    const areaTxt = (u) => u.papel === 'esf' ? `Sede ${u.sede_esf}` : (u.area || '—');
    // Master e profissional que nunca acessaram podem ser excluídos (e-mail digitado errado)
    const podeExcluir = (u) => u.id !== eu.id && (u.papel === 'esf' || !u.primeiro_acesso_feito);

    async function carregarAreas() {
      const { data } = await sb.from('areas_atuacao').select('nome').order('nome');
      $('area').innerHTML = '<option value="">Selecione</option>' +
        (data || []).map((a) => `<option value="${esc(a.nome)}">${esc(a.nome)}</option>`).join('') +
        `<option value="${OUTRA}">Outra (escrever nova)</option>`;
    }

    function ajustarCampos() {
      const t = $('tipo').value;
      $('lbl-area').hidden = t !== 'prestador';
      $('lbl-outra').hidden = true;
      $('lbl-sede').hidden = t !== 'esf';
      $('area').required = t === 'prestador';
      $('sede').required = t === 'esf';
    }
    $('tipo').addEventListener('change', ajustarCampos);
    $('area').addEventListener('change', () => { $('lbl-outra').hidden = $('area').value !== OUTRA; });

    async function mensagemErro(error) {
      try { const j = await error.context.json(); return j.erro || error.message; }
      catch { return error.message; }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = $('msg');
      const tipo = $('tipo').value;
      let area = null, sede = null;
      if (tipo === 'prestador') {
        area = $('area').value;
        if (area === OUTRA) area = $('area-outra').value.trim();
        if (!area) { m.textContent = 'Escolha ou digite a área de atuação.'; return; }
      }
      if (tipo === 'esf') {
        sede = Number($('sede').value);
        if (!Number.isInteger(sede) || sede <= 0) { m.textContent = 'Informe o número da sede.'; return; }
      }

      $('enviar').disabled = true;
      m.textContent = 'Cadastrando...';
      const { data, error } = await sb.functions.invoke('criar-profissional', {
        body: { nome: $('nome-prof').value.trim(), email: $('email').value.trim(), tipo, area, sede },
      });
      $('enviar').disabled = false;

      if (error) { m.textContent = await mensagemErro(error); return; }
      if (data?.erro) { m.textContent = data.erro; return; }

      m.textContent = 'Acesso cadastrado. Senha inicial: 12345678.';
      e.target.reset();
      ajustarCampos();
      $('lbl-outra').hidden = true;
      await carregarAreas();
    });

    // Contas de acesso
    let CONTAS = [];
    async function carregarContas() {
      const { data, error } = await sb.rpc('listar_contas');
      if (error) { $('contas-corpo').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return; }
      CONTAS = data || [];
      desenharContas();
    }

    function desenharContas() {
      const q = $('busca-conta').value.trim().toLowerCase();
      const f = $('filtro-conta').value;
      if (!CONTAS.length) { $('contas-corpo').innerHTML = '<p class="vazio">Nenhuma conta cadastrada.</p>'; return; }
      const data = CONTAS.filter((u) => {
        const sit = !u.ativo ? 'desativado' : u.primeiro_acesso_feito ? 'ativo' : 'pendente';
        if (f && sit !== f) return false;
        if (!q) return true;
        return (u.nome || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q);
      });
      if (!data.length) { $('contas-corpo').innerHTML = '<p class="vazio">Nenhuma conta encontrada com este filtro.</p>'; return; }
      $('contas-corpo').innerHTML = `<table>
        <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Área</th><th>Acesso</th><th></th></tr>` +
        data.map((u) => {
          const acesso = !u.ativo ? '<span class="tag tag-off">Desativado</span>'
            : u.primeiro_acesso_feito ? '<span class="tag tag-ok">Já acessou</span>'
            : '<span class="tag tag-pend">Nunca acessou</span>';
          let acoes = '';
          if (u.id === eu.id) {
            acoes = '<span class="cinza-txt">(sua conta)</span>';
          } else {
            acoes = u.ativo
              ? `<button class="btn-peq" style="background:#9a3a4a" data-acao="desativar" data-nunca="${u.primeiro_acesso_feito ? '0' : '1'}" data-id="${u.id}" data-nome="${esc(u.nome)}">Desativar</button>`
              : `<button class="btn-peq" style="background:var(--verde)" data-acao="reativar" data-id="${u.id}" data-nome="${esc(u.nome)}">Reativar</button>`;
            if (podeExcluir(u)) acoes += ` <button class="btn-peq" style="background:#7a2030" data-acao="excluir" data-id="${u.id}" data-nome="${esc(u.nome)}">Excluir</button>`;
          }
          return `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${rotulo(u)}</td><td>${esc(areaTxt(u))}</td><td>${acesso}</td><td>${acoes}</td></tr>`;
        }).join('') + '</table>';
    }

    $('abrir-contas').addEventListener('click', async () => {
      await carregarContas();
      $('contas').showModal();
    });
    $('fechar-contas').addEventListener('click', () => $('contas').close());

    $('contas-corpo').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-acao]');
      if (!b) return;
      const { acao, id, nome } = b.dataset;
      // Regra: conta que nunca acessou, quando desativada, é excluída automaticamente
      if (acao === 'excluir' || (acao === 'desativar' && b.dataset.nunca === '1')) {
        const msg = acao === 'excluir'
          ? `Excluir a conta de ${nome}? Use apenas para e-mail digitado errado. Esta ação não pode ser desfeita.`
          : `${nome} nunca acessou a plataforma. Ao desativar, a conta será excluída automaticamente. Confirma?`;
        if (!confirm(msg)) return;
        const { data, error } = await sb.functions.invoke('excluir-conta', { body: { usuario_id: id } });
        if (error) { alert(await mensagemErro(error)); return; }
        if (data?.erro) { alert(data.erro); return; }
        await carregarContas();
        return;
      }
      if (acao === 'desativar' || acao === 'reativar') {
        const ativar = acao === 'reativar';
        if (!ativar && !confirm(`Desativar o acesso de ${nome}? O login deixa de funcionar. O histórico continua visível ao master.`)) return;
        const { error } = await sb.from('usuarios').update({ ativo: ativar }).eq('id', id);
        if (error) { alert('Não foi possível alterar: ' + error.message); return; }
        await carregarContas();
      }
    });

    $('busca-conta').addEventListener('input', desenharContas);
    $('filtro-conta').addEventListener('change', desenharContas);

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = 'index.html'; return; }
      const { data: u } = await sb.from('usuarios').select('id,nome,papel').eq('auth_uid', session.user.id).maybeSingle();
      if (!u) { await sb.auth.signOut(); location.href = 'index.html'; return; }
      if (u.papel !== 'master') { location.href = 'dashboard.html'; return; }
      eu = u;
      $('nome').textContent = u.nome;
      ajustarCampos();
      await carregarAreas();
    })();
  </script>
</body>
</html>
